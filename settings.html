<!-- 云绘生图 v2.0 扩展面板精简入口（详细设置在子面板里） -->
<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>☁️ 云绘生图</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="flex-container flexnowrap">
            <span class="margin0">模式：<b id="yh_status_mode">标签生图</b></span>
            <span class="margin0" style="margin-left:auto;">状态：<span id="yh_status_enabled">—</span></span>
        </div>
        <div class="flex-container flexnowrap" style="margin-top:8px;">
            <button id="yh_open_panel" class="menu_button flex1"><i class="fa-solid fa-expand"></i> 打开云绘生图面板</button>
        </div>
        <div class="flex-container flexnowrap" style="margin-top:6px;">
            <label class="checkbox_label" for="yh_fab_visible"><input type="checkbox" id="yh_fab_visible" class="checkbox"><span>显示悬浮按钮</span></label>
        </div>
    </div>
</div>
